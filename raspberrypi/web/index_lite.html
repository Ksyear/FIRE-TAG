<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRE-TAG</title>
<style>
/* 외부 파일 없음: Pi 핫스팟에는 인터넷이 없습니다. */
:root {
  --bg: #1b1b1b; --card: #1b1b1b; --line: #3a3a3a; --text: #f0f0f0; --sub: #9a9a9a;
  --faint: #7d7d7d; --red: #ef4444; --green: #22b573; --gray: #8c8c8c;
  --ui: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 14px; }
main {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 44%); gap: 12px;
  height: 100%; padding: 12px;
}
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
#mapCard { position: relative; padding: 6px; min-height: 0; }
#map { width: 100%; height: 100%; display: block; }
#linkMsg {
  position: absolute; top: 8px; left: 8px; font-size: 12px; color: var(--red);
  display: none;
}
aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
aside .card:last-child { flex: 1; min-height: 0; display: flex; flex-direction: column; }
h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }

.row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-weight: 600; }
.row .st { margin-left: auto; font-weight: 400; color: var(--sub); }
.row .st.bad { color: var(--red); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray); flex: none; }
.dot.on { background: var(--green); } .dot.off { background: var(--red); }

#events { flex: 1; overflow-y: auto; min-height: 0; }
.ev { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); line-height: 1.4; }
.ev:first-child { border-top: 0; }
.ev time { color: var(--faint); flex: none; width: 48px; }
.ev span { font-weight: 600; }
.empty { color: var(--sub); }

svg text { font-family: var(--ui); }
</style>
</head>
<body>
<main>
  <section class="card" id="mapCard">
    <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="평면도"></svg>
    <span id="linkMsg">Pi 연결 끊김</span>
  </section>

  <aside>
    <section class="card">
      <h2>앵커</h2>
      <div id="anchors"></div>
    </section>
    <section class="card">
      <h2>이벤트 (최근 10개)</h2>
      <div id="events"></div>
    </section>
  </aside>
</main>

<script>
"use strict";
const POLL_MS = 500;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
let mapKey = "";
let unit = 0.1;            // 화면 약 14px에 해당하는 미터 값
let anchorEls = new Map(); // 앵커 id -> 사각형
const tagEls = new Map();  // tag id -> { g, dot, label }
let tagLayer = null;

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(s) {
  if (s < 5) return "방금";
  if (s < 60) return `${Math.round(s)}초 전`;
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  return `${Math.floor(s / 3600)}시간 전`;
}

// 방, 앵커 같은 고정 요소는 좌표나 화면 크기가 바뀔 때만 다시 그림
function buildStatic(state) {
  const xs = [], ys = [];
  if (state.room) { xs.push(state.room.x0, state.room.x1); ys.push(state.room.y0, state.room.y1); }
  state.anchors.forEach(a => { xs.push(a.x); ys.push(a.y); });
  if (!xs.length) { xs.push(0, 5); ys.push(0, 4); }
  const pad = 0.9;  // 오른쪽 앵커 라벨이 잘리지 않을 여백
  const b = { x0: Math.min(...xs) - pad, x1: Math.max(...xs) + pad, y0: Math.min(...ys) - pad, y1: Math.max(...ys) + pad };

  const box = svg.getBoundingClientRect();
  const key = JSON.stringify([b, state.room, state.anchors.map(a => [a.id, a.x, a.y]),
                              Math.round(box.width), Math.round(box.height)]);
  if (key === mapKey) return;
  mapKey = key;

  svg.textContent = "";
  tagEls.clear();
  anchorEls = new Map();
  const w = b.x1 - b.x0, h = b.y1 - b.y0;
  unit = 14 / (Math.min(box.width / w, box.height / h) || 50);
  // 화면 y는 아래로 증가, 방 y는 위로 증가: (x, -y)로 그림
  svg.setAttribute("viewBox", `${b.x0} ${-b.y1} ${w} ${h}`);

  if (state.room) {
    const r = state.room;
    el("rect", { x: r.x0, y: -r.y1, width: r.x1 - r.x0, height: r.y1 - r.y0, fill: "none",
                 stroke: "#8a8a8a", "stroke-width": unit * 0.1 }, svg);
  }
  const s = unit * 0.5;
  state.anchors.forEach(a => {
    const g = el("g", {}, svg);
    anchorEls.set(a.id, el("rect", { x: a.x - s / 2, y: -a.y - s / 2, width: s, height: s, fill: "#9a9a9a" }, g));
    el("text", { x: a.x + s, y: -a.y + s * 0.4, "font-size": unit * 0.6, fill: "#cfcfcf" }, g).textContent = `A${a.id}`;
  });
  tagLayer = el("g", {}, svg);
}

function drawMap(state) {
  state.anchors.forEach(a => {
    const r = anchorEls.get(a.id);
    if (r) r.setAttribute("fill", a.online ? "#9a9a9a" : "#ef4444");
  });
  const seen = new Set();
  state.tags.forEach(t => {
    seen.add(t.id);
    let e = tagEls.get(t.id);
    if (!e) {
      const g = el("g", {}, tagLayer);
      e = { g, dot: el("circle", { r: unit * 0.3 }, g),
            label: el("text", { x: unit * 0.7, y: -unit * 0.6, "font-size": unit * 0.6 }, g) };
      tagEls.set(t.id, e);
    }
    // 경로 없이 점만 이동 (움직임 효과 없이 바로 위치 갱신)
    e.g.setAttribute("transform", `translate(${t.x} ${-t.y})`);
    const color = t.lost ? "#8c8c8c" : "#ef4444";
    e.dot.setAttribute("fill", color);
    e.label.setAttribute("fill", color);
    e.label.textContent = t.lost ? `TAG ${t.id} 끊김` : state.tags.length > 1 ? `TAG ${t.id}` : "TAG";
  });
  for (const [id, e] of tagEls) {
    if (!seen.has(id)) { e.g.remove(); tagEls.delete(id); }
  }
}

function renderAnchors(state) {
  document.getElementById("anchors").innerHTML = state.anchors.map(a => {
    const never = a.never ?? (a.age_s == null);
    const text = a.online ? "작동 중" : never ? "수신 기록 없음" : "응답 없음";
    return `<div class="row"><span class="dot ${a.online ? "on" : never ? "" : "off"}"></span>
      <span>A${a.id}</span><span class="st ${a.online || never ? "" : "bad"}">${text}</span></div>`;
  }).join("") || '<p class="empty">앵커 정보 없음</p>';
}

function renderEvents(state) {
  const box = document.getElementById("events");
  const events = state.events.slice(0, 10);
  box.innerHTML = events.length
    ? events.map(e => `<div class="ev"><time>${ago(e.age_s)}</time><span>${esc(e.message)}</span></div>`).join("")
    : `<p class="empty">${state.db ? "이벤트 없음" : "수신기가 아직 DB를 만들지 않았습니다"}</p>`;
}

async function poll() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 2000);
  try {
    const res = await fetch("/api/state", { cache: "no-store", signal: ctrl.signal });
    if (!res.ok) throw new Error(res.status);
    const state = await res.json();
    buildStatic(state);
    drawMap(state);
    renderAnchors(state);
    renderEvents(state);
    document.getElementById("linkMsg").style.display = "none";
  } catch (e) {
    document.getElementById("linkMsg").style.display = "block";
  } finally {
    clearTimeout(timer);
    setTimeout(poll, POLL_MS);
  }
}
poll();
</script>
</body>
</html>

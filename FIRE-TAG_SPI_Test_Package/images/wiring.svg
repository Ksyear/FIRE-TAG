<text x="82" y="161.56" fill="#53657a" font-size="32" font-weight="400" text-anchor="start" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif">ESP32 DevKitC / LOLIN D32 공통  |  SPI Mode 0 · 1 MHz  |  현재 코드 Serial 9600</text>
<rect x="80" y="195" width="2040" height="65" rx="12" fill="#e7eef8" stroke="none" stroke-width="2"/>
<text x="105" y="235.9" fill="#1c3045" font-size="30" font-weight="400" text-anchor="start" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif">신호 연결도입니다. 실제 보드의 핀 위치 대신 실크 인쇄와 GPIO 번호를 확인하십시오.</text>

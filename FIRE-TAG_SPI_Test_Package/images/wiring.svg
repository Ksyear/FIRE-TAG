<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500">
<title>FIRE-TAG ESP32와 DWM3000EVB 신호 배선도</title>
<desc>GPIO18 SCK, GPIO19 MISO, GPIO23 MOSI, GPIO27 CS, GPIO26 RST, GPIO34 IRQ. 3V3 전원, 공통 GND, WAKEUP은 GND. J1은 2번과 3번 연결. 실제 핀 위치를 나타내는 그림이 아닙니다.</desc>
